<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Handy-Test</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 25px;
      font-family: Arial, sans-serif;
      background: #f3f5f7;
      color: #222;
    }

    .box {
      width: 100%;
      max-width: 500px;
      margin: 40px auto;
      padding: 25px;
      background: white;
      border-radius: 14px;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.12);
    }

    h1 {
      margin-top: 0;
      font-size: 25px;
    }

    textarea {
      width: 100%;
      min-height: 150px;
      padding: 14px;
      font-size: 18px;
      border: 2px solid #aaa;
      border-radius: 8px;
      resize: vertical;
    }

    button {
      width: 100%;
      margin-top: 16px;
      padding: 16px;
      border: none;
      border-radius: 8px;
      background: #007bc0;
      color: white;
      font-size: 19px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      background: #999;
      cursor: not-allowed;
    }

    #meldung {
      margin-top: 18px;
      text-align: center;
      font-weight: bold;
    }

    .erfolg {
      color: green;
    }

    .fehler {
      color: #c00000;
    }
  </style>
</head>

<body>

<div class="box">
  <h1>Text an Rechner senden</h1>

  <textarea
    id="text"
    placeholder="Hier Text eingeben..."
  ></textarea>

  <button id="sendenButton" onclick="senden()">
    Senden
  </button>

  <div id="meldung"></div>
</div>

<script>
  const FLOW_URL = "HIER_DIE_URL_DIREKT_AUS_POWER_AUTOMATE_EINFÜGEN";

  async function senden() {
    const textfeld = document.getElementById("text");
    const button = document.getElementById("sendenButton");
    const meldung = document.getElementById("meldung");

    const text = textfeld.value.trim();

    if (!text) {
      meldung.className = "fehler";
      meldung.textContent = "Bitte zuerst einen Text eingeben.";
      return;
    }

    button.disabled = true;
    button.textContent = "Wird gesendet...";
    meldung.className = "";
    meldung.textContent = "Verbindung wird hergestellt...";

    try {
      const response = await fetch(FLOW_URL, {
        method: "POST",
        mode: "cors",
        headers: {
          "Content-Type": "text/plain;charset=UTF-8"
        },
        body: JSON.stringify({
          text: text
        })
      });

      const antwortText = await response.text();

      if (!response.ok) {
        throw new Error(
          "HTTP " + response.status + " – " + antwortText
        );
      }

      meldung.className = "erfolg";
      meldung.textContent =
        "Erfolgreich gesendet. Serverantwort: " + antwortText;

      textfeld.value = "";

    } catch (fehler) {
      console.error(fehler);

      meldung.className = "fehler";
      meldung.textContent =
        "GENAUER FEHLER: " + fehler.message;
    } finally {
      button.disabled = false;
      button.textContent = "Senden";
    }
  }
</script>

</body>
</html>
